# Automatic checks for every pull request and for pushes to develop/main.
#
# backend:  install, Prisma client, migrations = schema, type check, lint, tests, build
# frontend: install, type check, lint, tests, production build (de + en)
# e2e:      real browser (Playwright) against the built app, see e2e/README.md
# docker:   the production image builds (Dockerfile)
#
# A red check means: do not merge before it is fixed.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as the runtime in the Dockerfile (LTS)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check database migrations against the schema
        # fails when schema.prisma was changed without a matching migration
        # (Prisma 7: shadow database from prisma.config.ts)
        env:
          SHADOW_DATABASE_URL: file:./ci-shadow.db
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # LTS, supported by Angular 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint (angular-eslint)
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      - name: Production build (all languages)
        run: npx ng build --configuration production

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build backend
        working-directory: backend
        run: npm ci && npx prisma generate && npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npx ng build --configuration production

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload report (screenshots, traces) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t peer-grading-ci .
