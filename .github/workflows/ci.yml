# Automatic checks for every pull request and for pushes to develop/main.
#
# backend:  install, Prisma client, migrations = schema, type check, tests, build
# frontend: install, tests, production build (de + en)
# docker:   the production image builds (Dockerfile)
#
# A red check means: do not merge before it is fixed.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the runtime in the Dockerfile
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check database migrations against the schema
        # fails when schema.prisma was changed without a matching migration
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "file:./ci-shadow.db" --exit-code

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Angular 17 supports Node 18 and 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Tests
        run: npm test -- --ci

      - name: Production build (all languages)
        run: npx ng build --configuration production

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t peer-grading-ci .
